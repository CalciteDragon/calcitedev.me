<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Pixel Quest placeholder art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a45" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- distant pixel clouds -->
  <g fill="#1e2a45" shape-rendering="crispEdges" opacity="0.9">
    <rect x="96" y="64" width="64" height="12"/><rect x="112" y="52" width="32" height="12"/>
    <rect x="432" y="88" width="80" height="12"/><rect x="456" y="76" width="40" height="12"/>
  </g>

  <!-- horizon glow -->
  <rect x="0" y="298" width="640" height="3" fill="#22d3ee" opacity="0.55" filter="url(#glow)"/>
  <rect x="0" y="301" width="640" height="59" fill="#22d3ee" opacity="0.05"/>

  <!-- staircase platforms -->
  <g shape-rendering="crispEdges">
    <g fill="#101a30" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2" filter="url(#glow)">
      <rect x="72" y="264" width="112" height="20"/>
      <rect x="232" y="224" width="112" height="20"/>
      <rect x="392" y="184" width="112" height="20"/>
    </g>
    <!-- platform top highlights -->
    <g fill="#22d3ee" opacity="0.55">
      <rect x="76" y="266" width="104" height="2"/>
      <rect x="236" y="226" width="104" height="2"/>
      <rect x="396" y="186" width="104" height="2"/>
    </g>
  </g>

  <!-- coins above platforms -->
  <g fill="#f59e0b" shape-rendering="crispEdges" filter="url(#glow)">
    <rect x="120" y="228" width="12" height="12"/>
    <rect x="280" y="188" width="12" height="12"/>
    <rect x="440" y="148" width="12" height="12"/>
  </g>
  <g fill="#fde68a" shape-rendering="crispEdges">
    <rect x="123" y="231" width="3" height="3"/>
    <rect x="283" y="191" width="3" height="3"/>
    <rect x="443" y="151" width="3" height="3"/>
  </g>

  <!-- pixel hero sprite on middle platform -->
  <g shape-rendering="crispEdges">
    <rect x="296" y="192" width="20" height="20" fill="#22d3ee"/>
    <rect x="300" y="196" width="4" height="4" fill="#0b0f1a"/>
    <rect x="308" y="196" width="4" height="4" fill="#0b0f1a"/>
    <rect x="300" y="205" width="12" height="3" fill="#0b0f1a"/>
    <rect x="292" y="212" width="28" height="6" fill="#0e7490"/>
    <rect x="296" y="218" width="8" height="6" fill="#164e63"/>
    <rect x="308" y="218" width="8" height="6" fill="#164e63"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" opacity="0.7">
    <path d="M14 34V14h20"/><path d="M606 14h20v20"/>
    <path d="M626 326v20h-20"/><path d="M34 346H14v-20"/>
  </g>
</svg>

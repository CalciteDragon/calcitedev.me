<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="CodeCraft API placeholder art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a45" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- terminal window -->
  <rect x="112" y="56" width="416" height="248" rx="8" fill="#0f1626" stroke="#ec4899" stroke-opacity="0.8" stroke-width="2" filter="url(#glow)"/>
  <rect x="112" y="56" width="416" height="32" rx="8" fill="#111c33"/>
  <rect x="112" y="80" width="416" height="8" fill="#111c33"/>
  <circle cx="134" cy="72" r="5" fill="#ec4899"/>
  <circle cx="152" cy="72" r="5" fill="#f59e0b"/>
  <circle cx="170" cy="72" r="5" fill="#22d3ee"/>

  <!-- opening brace -->
  <text x="146" y="196" font-family="monospace" font-size="96" fill="#ec4899" filter="url(#glow)">&#123;</text>
  <!-- closing brace -->
  <text x="448" y="196" font-family="monospace" font-size="96" fill="#ec4899" filter="url(#glow)">&#125;</text>

  <!-- code lines between braces -->
  <g shape-rendering="crispEdges">
    <rect x="232" y="120" width="56" height="10" rx="2" fill="#8b5cf6" opacity="0.9"/>
    <rect x="296" y="120" width="96" height="10" rx="2" fill="#22d3ee" opacity="0.7"/>

    <rect x="232" y="146" width="88" height="10" rx="2" fill="#ec4899" opacity="0.8"/>
    <rect x="328" y="146" width="64" height="10" rx="2" fill="#9ca3af" opacity="0.5"/>

    <rect x="232" y="172" width="48" height="10" rx="2" fill="#22d3ee" opacity="0.8"/>
    <rect x="288" y="172" width="120" height="10" rx="2" fill="#8b5cf6" opacity="0.6"/>

    <rect x="232" y="198" width="104" height="10" rx="2" fill="#9ca3af" opacity="0.5"/>
    <rect x="344" y="198" width="48" height="10" rx="2" fill="#ec4899" opacity="0.75"/>
  </g>

  <!-- prompt line + cursor -->
  <g shape-rendering="crispEdges">
    <rect x="146" y="252" width="20" height="10" fill="#22d3ee"/>
    <rect x="174" y="252" width="120" height="10" rx="2" fill="#9ca3af" opacity="0.6"/>
    <rect x="302" y="248" width="10" height="18" fill="#ec4899" filter="url(#glow)"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#ec4899" stroke-width="3" fill="none" opacity="0.7">
    <path d="M14 34V14h20"/><path d="M606 14h20v20"/>
    <path d="M626 326v20h-20"/><path d="M34 346H14v-20"/>
  </g>
</svg>

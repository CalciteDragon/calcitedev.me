<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="DevBoard placeholder art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a45" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- window chrome -->
  <rect x="80" y="48" width="480" height="264" rx="8" fill="#0f1626" stroke="#3b82f6" stroke-opacity="0.75" stroke-width="2" filter="url(#glow)"/>
  <rect x="80" y="48" width="480" height="32" rx="8" fill="#111c33"/>
  <rect x="80" y="72" width="480" height="8" fill="#111c33"/>
  <circle cx="102" cy="64" r="5" fill="#ec4899"/>
  <circle cx="120" cy="64" r="5" fill="#f59e0b"/>
  <circle cx="138" cy="64" r="5" fill="#22d3ee"/>

  <!-- sidebar -->
  <rect x="96" y="96" width="88" height="200" rx="4" fill="#111c33"/>
  <g fill="#3b82f6" opacity="0.75">
    <rect x="108" y="112" width="64" height="8" rx="2"/>
    <rect x="108" y="132" width="48" height="8" rx="2" opacity="0.6"/>
    <rect x="108" y="152" width="56" height="8" rx="2" opacity="0.6"/>
    <rect x="108" y="172" width="40" height="8" rx="2" opacity="0.6"/>
  </g>

  <!-- bar chart panel -->
  <rect x="200" y="96" width="160" height="120" rx="4" fill="#111c33"/>
  <g shape-rendering="crispEdges" filter="url(#glow)">
    <rect x="216" y="168" width="16" height="32" fill="#3b82f6"/>
    <rect x="240" y="148" width="16" height="52" fill="#22d3ee"/>
    <rect x="264" y="128" width="16" height="72" fill="#3b82f6"/>
    <rect x="288" y="156" width="16" height="44" fill="#8b5cf6"/>
    <rect x="312" y="116" width="16" height="84" fill="#22d3ee"/>
  </g>

  <!-- line chart panel -->
  <rect x="376" y="96" width="168" height="120" rx="4" fill="#111c33"/>
  <polyline points="392,192 420,168 448,176 476,140 504,152 528,116"
            fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#glow)"/>
  <g fill="#22d3ee">
    <circle cx="420" cy="168" r="3"/><circle cx="476" cy="140" r="3"/><circle cx="528" cy="116" r="3"/>
  </g>

  <!-- kanban cards -->
  <g>
    <rect x="200" y="232" width="104" height="64" rx="4" fill="#111c33"/>
    <rect x="212" y="244" width="80" height="10" rx="2" fill="#3b82f6" opacity="0.8"/>
    <rect x="212" y="262" width="56" height="8" rx="2" fill="#3b82f6" opacity="0.4"/>

    <rect x="320" y="232" width="104" height="64" rx="4" fill="#111c33"/>
    <rect x="332" y="244" width="80" height="10" rx="2" fill="#8b5cf6" opacity="0.8"/>
    <rect x="332" y="262" width="64" height="8" rx="2" fill="#8b5cf6" opacity="0.4"/>

    <rect x="440" y="232" width="104" height="64" rx="4" fill="#111c33"/>
    <rect x="452" y="244" width="80" height="10" rx="2" fill="#22d3ee" opacity="0.8"/>
    <rect x="452" y="262" width="48" height="8" rx="2" fill="#22d3ee" opacity="0.4"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.7">
    <path d="M14 34V14h20"/><path d="M606 14h20v20"/>
    <path d="M626 326v20h-20"/><path d="M34 346H14v-20"/>
  </g>
</svg>

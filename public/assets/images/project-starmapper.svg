<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="StarMapper placeholder art">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a45" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- scattered background stars -->
  <g fill="#e5e7eb" shape-rendering="crispEdges">
    <rect x="88" y="60" width="3" height="3" opacity="0.7"/>
    <rect x="180" y="300" width="3" height="3" opacity="0.5"/>
    <rect x="248" y="84" width="2" height="2" opacity="0.6"/>
    <rect x="330" y="40" width="3" height="3" opacity="0.8"/>
    <rect x="420" y="310" width="2" height="2" opacity="0.5"/>
    <rect x="520" y="70" width="3" height="3" opacity="0.7"/>
    <rect x="580" y="180" width="2" height="2" opacity="0.6"/>
    <rect x="60" y="200" width="2" height="2" opacity="0.5"/>
    <rect x="140" y="150" width="2" height="2" opacity="0.6"/>
    <rect x="480" y="140" width="2" height="2" opacity="0.55"/>
  </g>

  <!-- constellation lines -->
  <polyline points="152,236 232,168 312,196 384,120 464,152 528,96"
            fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.75" filter="url(#glow)"/>
  <line x1="312" y1="196" x2="352" y2="264" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.55" filter="url(#glow)"/>

  <!-- constellation stars: diamonds -->
  <g fill="#f59e0b" filter="url(#glow)">
    <path d="M152 228l6 8-6 8-6-8z"/>
    <path d="M232 160l6 8-6 8-6-8z"/>
    <path d="M312 188l6 8-6 8-6-8z"/>
    <path d="M384 112l6 8-6 8-6-8z"/>
    <path d="M464 144l6 8-6 8-6-8z"/>
    <path d="M528 88l6 8-6 8-6-8z"/>
    <path d="M352 256l6 8-6 8-6-8z"/>
  </g>

  <!-- selection reticle around one star -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" filter="url(#glow)">
    <circle cx="384" cy="120" r="26"/>
    <path d="M384 86v12M384 142v12M350 120h12M406 120h12"/>
  </g>

  <!-- info readout chip -->
  <g>
    <rect x="424" y="196" width="120" height="44" rx="6" fill="#111c33" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="436" y="208" width="72" height="8" rx="2" fill="#f59e0b" opacity="0.85"/>
    <rect x="436" y="222" width="96" height="7" rx="2" fill="#9ca3af" opacity="0.5"/>
  </g>

  <!-- corner brackets -->
  <g stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.7">
    <path d="M14 34V14h20"/><path d="M606 14h20v20"/>
    <path d="M626 326v20h-20"/><path d="M34 346H14v-20"/>
  </g>
</svg>

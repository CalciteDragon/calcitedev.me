<section class="hero" aria-label="Hero introduction">
  <div class="hero__container">
    <div class="hero__avatar">
      <img
        src="assets/pixel-art/avatar-placeholder.svg"
        alt="Pixel art avatar of Tyler Hawthorn"
        class="hero__avatar-img"
        width="300"
        height="300"
      />
      <div class="hero__platform" aria-hidden="true"></div>
    </div>

    <div class="hero__content">
      <h1 class="hero__name">
        <img
          src="assets/images/hero-title.webp"
          [alt]="bio().name"
          class="hero__name-img"
          width="1400"
          height="467"
          fetchpriority="high"
          decoding="async"
        />
      </h1>
      <div class="hero__tagline">
        <p class="hero__alias">AKA {{ bio().alias.toUpperCase() }}</p>
        <p class="hero__subtitle">{{ bio().title }}</p>
      </div>
    </div>
  </div>

  <div class="hero__ufo" aria-hidden="true">
    <div class="hero__ufo-disc">
      <div class="hero__ufo-glow hero__ufo-glow--l">
        <img src="assets/pixel-art/ufo-placeholder.svg" alt="" width="220" height="120">
      </div>
      <div class="hero__ufo-glow hero__ufo-glow--r">
        <img src="assets/pixel-art/ufo-placeholder.svg" alt="" width="220" height="120">
      </div>
      <img
        src="assets/pixel-art/ufo-placeholder.svg"
        alt=""
        class="hero__ufo-img"
        width="220"
        height="120"
      />
    </div>
    <div class="hero__ufo-beam"></div>
  </div>

  <div class="hero__scroll-indicator" aria-hidden="true">
    <span class="hero__scroll-arrow"></span>
  </div>
</section>

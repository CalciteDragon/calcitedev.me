<div class="project-list">
  @for (project of projects(); track project.slug) {
    <app-project-card
      [title]="project.title"
      [slug]="project.slug"
      [description]="project.description"
      [imageUrl]="project.imageUrl"
      [tags]="project.tags"
      [glowColor]="project.glowColor"
      [liveUrl]="project.liveUrl"
      [githubUrl]="project.githubUrl"
    />
  }
</div>

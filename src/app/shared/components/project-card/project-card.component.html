<app-card [glowColor]="glowColor()">
  @if (imageUrl()) {
    <div class="project-card__thumbnail">
      <img [src]="imageUrl()" [alt]="title()" loading="lazy" />
    </div>
  }
  <div class="project-card__body">
    <h3 class="project-card__title">
      <a class="project-card__title-link" [routerLink]="['/projects', slug()]">{{ title() }}</a>
    </h3>
    <p class="project-card__description">{{ description() }}</p>
    @if (tags().length > 0) {
      <div class="project-card__tags">
        @for (tag of tags(); track tag) {
          <app-tech-tag [name]="tag" />
        }
      </div>
    }
    @if (liveUrl() || githubUrl()) {
      <div class="project-card__links">
        @if (liveUrl()) {
          <a [href]="liveUrl()" target="_blank" rel="noopener noreferrer" class="project-card__link">
            Live Demo
          </a>
        }
        @if (githubUrl()) {
          <a [href]="githubUrl()" target="_blank" rel="noopener noreferrer" class="project-card__link">
            GitHub
          </a>
        }
      </div>
    }
  </div>
</app-card>

<header class="navbar">
  <nav class="navbar__inner" aria-label="Main navigation">
    <a class="navbar__brand" routerLink="/" aria-label="Calcite — home">
      <span class="navbar__brand-mark" aria-hidden="true">
        <img
          class="navbar__brand-image"
          src="/assets/images/navbar-logo.png"
          alt=""
          width="38"
          height="38"
        />
      </span>
      <span class="navbar__brand-text">
        ALCITE<span class="navbar__brand-suffix">dev.me</span>
      </span>
    </a>

    <!-- Desktop links (hidden on mobile) -->
    <ul class="navbar__links">
      <li>
        <button type="button" class="navbar__link" [class.navbar__link--active]="scrollService.activeSection() === 'about'" (click)="navigateToSection('about')">About</button>
      </li>
      <li>
        <button type="button" class="navbar__link" [class.navbar__link--active]="scrollService.activeSection() === 'projects'" (click)="navigateToSection('projects')">Projects</button>
      </li>
      <li>
        <button type="button" class="navbar__link" [class.navbar__link--active]="scrollService.activeSection() === 'extras'" (click)="navigateToSection('extras')">Extras</button>
      </li>
      <li>
        <button type="button" class="navbar__link" [class.navbar__link--active]="scrollService.activeSection() === 'contact'" (click)="navigateToSection('contact')">Contact</button>
      </li>
    </ul>

    <!-- Hamburger toggle (mobile only) -->
    <button
      type="button"
      class="navbar__hamburger"
      [class.navbar__hamburger--open]="isMenuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span class="navbar__hamburger-line"></span>
      <span class="navbar__hamburger-line"></span>
      <span class="navbar__hamburger-line"></span>
    </button>
  </nav>
</header>

<!-- Mobile overlay -->
<div
  class="navbar__overlay"
  [class.navbar__overlay--visible]="isMenuOpen()"
  (click)="closeMenu()"
></div>

<!-- Mobile drawer -->
<div class="navbar__drawer" [class.navbar__drawer--open]="isMenuOpen()">
  <ul class="navbar__drawer-links">
    <li><button type="button" class="navbar__drawer-link" [class.navbar__drawer-link--active]="scrollService.activeSection() === 'about'" (click)="navigateToSection('about')">About</button></li>
    <li><button type="button" class="navbar__drawer-link" [class.navbar__drawer-link--active]="scrollService.activeSection() === 'projects'" (click)="navigateToSection('projects')">Projects</button></li>
    <li><button type="button" class="navbar__drawer-link" [class.navbar__drawer-link--active]="scrollService.activeSection() === 'extras'" (click)="navigateToSection('extras')">Extras</button></li>
    <li><button type="button" class="navbar__drawer-link" [class.navbar__drawer-link--active]="scrollService.activeSection() === 'contact'" (click)="navigateToSection('contact')">Contact</button></li>
  </ul>
</div>
